name: CI

on: [push, pull_request]

jobs:

  test:

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # It is important to install java before installing clojure tools which needs java
      # exclusions: babashka, clj-kondo and cljstyle
      - name: Prepare java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@12.5
        with:
          # Install just one or all simultaneously
          # The value must indicate a particular version of the tool, or use 'latest'
          # to always provision the latest version
          bb: latest

      # Optional step:
      - name: Cache clojure dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          # List all files containing dependencies:
          key: cljdeps-${{ hashFiles('deps.edn') }}
          # key: cljdeps-${{ hashFiles('deps.edn', 'bb.edn') }}
          # key: cljdeps-${{ hashFiles('project.clj') }}
          # key: cljdeps-${{ hashFiles('build.boot') }}
          restore-keys: cljdeps-

      - name: Run clj tests
        run: bb test:clj :clj-all

      - name: Run bb tests
        run: bb test:bb

      # The SOCKS5 tests above run against a server in this repo, which shares
      # its reading of RFC 1928 with the client. These run against one neither
      # of us wrote. They skip where SOCKS_PROXY_PORT is unset.
      - name: Install a SOCKS5 proxy
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y microsocks

      - name: Test against a SOCKS5 proxy
        if: matrix.os == 'ubuntu-latest'
        env:
          SOCKS_PROXY_PORT: 21080
        run: |
          microsocks -p 21080 &
          sleep 1
          bb test:clj :clj-1.11 -n babashka.http-client-test \
            -v babashka.http-client-test/socks5-external-proxy-test

      - name: Test against a SOCKS5 proxy that wants a user and password
        if: matrix.os == 'ubuntu-latest'
        env:
          SOCKS_PROXY_PORT: 21081
          SOCKS_PROXY_USER: bob
          SOCKS_PROXY_PASS: secret
        run: |
          microsocks -p 21081 -u bob -P secret &
          sleep 1
          bb test:clj :clj-1.11 -n babashka.http-client-test \
            -v babashka.http-client-test/socks5-external-proxy-test
